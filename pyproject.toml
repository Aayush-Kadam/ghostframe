[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostframe"
version = "0.1.0rc1"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Local scripted-agent execution recorder and branching debugger"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1,<3"]

[project.scripts]
ghostframe = "ghostframe.cli:main"

[tool.setuptools.packages.find]
include = ["ghostframe*"]

[tool.setuptools.package-data]
ghostframe = ["fixtures.json", "static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
